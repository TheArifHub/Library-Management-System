<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Registration - Modern Library Hub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/member-register.css">
    <script src="/js/member-register.js"></script>
  </head>
  <body>
    <nav class="glass-nav">
      <div class="nav-logo">ModernLib</div>
      <div class="nav-buttons">
        <a href="/" class="nav-link">Home</a>
        <a href="/login" class="nav-link">Login</a>
      </div>
    </nav>

    <div class="floating-books">
      <!-- Books will be added via JavaScript -->
    </div>

    <div class="container">
      <form
        th:action="@{/member/register}"
        method="post"
        th:object="${member}"
      >
        <h1>Join ModernLib</h1>

        <div id="memberFields">
          <div>
            <input
              type="text"
              th:field="*{fullName}"
              placeholder="Enter your full name"
            />
            <span class="error" th:errors="*{fullName}"></span>
          </div>
          <div>
            <input
              type="email"
              th:field="*{email}"
              placeholder="Enter your email"
            />
            <span class="error" th:errors="*{email}"></span>
          </div>
          <div>
            <input
              type="tel"
              th:field="*{phone}"
              placeholder="Enter your phone number"
            />
            <span class="error" th:errors="*{phone}"></span>
          </div>
          <div>
            <input
              type="text"
              th:field="*{address}"
              placeholder="Enter your address"
            />
            <span class="error" th:errors="*{address}"></span>
          </div>
          <div>
            <input
              type="password"
              th:field="*{password}"
              placeholder="Create password"
            />
            <span class="error" th:errors="*{password}"></span>
          </div>
          <div>
            <input
              type="password"
              th:field="*{confirmPassword}"
              placeholder="Confirm password"
            />
            <span class="error" th:errors="*{confirmPassword}"></span>
          </div>
        </div>
        <div>
          <button type="submit">Create Account</button>
        </div>
      </form>
      <p align="center">Register as a <a href="/librarian/register">Librarian</a></p>
    </div>
  </body>
</html>
