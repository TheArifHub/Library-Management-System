<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Librarian Registration - Modern Library Hub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link 
      rel="stylesheet" 
      href="/css/librarian-register.css" 
      />
    <script src="/js/librarian-register"></script>
  </head>
  <body>
    <nav class="glass-nav">
      <div class="nav-logo">ModernLib</div>
      <div class="nav-buttons">
        <a href="/" class="nav-link">Home</a>
        <a href="/login" class="nav-link">Login</a>
      </div>
    </nav>

    <div class="floating-books">
      <!-- Books will be added via JavaScript -->
    </div>

    <div class="container">
      <form
        th:action="@{/librarian/register}"
        method="post"
        th:object="${librarian}"
      >
        <h1>Join as Librarian</h1>

        <div>
          <input
            type="text"
            th:field="*{librarianId}"
            th:value="${librarianId}"
            placeholder="Enter Librarian ID"
          />
          <span class="error" th:errors="*{librarianId}"></span>
        </div>
        <div>
          <input
            type="text"
            th:field="*{fullName}"
            placeholder="Enter full name"
          />
          <span class="error" th:errors="*{fullName}"></span>
        </div>
        <div>
          <input
            type="email"
            th:field="*{email}"
            placeholder="Enter your email"
          />
          <span class="error" th:errors="*{email}"></span>
        </div>
        <div>
          <input
            type="tel"
            th:field="*{phone}"
            placeholder="Enter your phone number"
          />
          <span class="error" th:errors="*{phone}"></span>
        </div>
        <div>
          <input
            type="password"
            th:field="*{password}"
            placeholder="Create password"
          />
          <span class="error" th:errors="*{password}"></span>
        </div>
        <div>
          <input
            type="password"
            th:field="*{confirmPassword}"
            placeholder="Confirm password"
          />
          <span class="error" th:errors="*{confirmPassword}"></span>
        </div>
        <button type="submit">Create Account</button>
        </form>
        <p align="cneter">Register as a <a href="/member/register">Member</a></p>
    </div>
  </body>
</html>
