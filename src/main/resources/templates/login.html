<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Login - Modern Library Hub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/login.css" />
    <script src="/js/login.js"></script>
  </head>
  <body>
    <nav class="glass-nav">
      <div class="nav-logo">ModernLib</div>
      <div class="nav-buttons">
        <a href="/" class="nav-link">Home</a>
        <a href="/member/register" class="nav-link">Register</a>
      </div>
    </nav>

    <div class="floating-books">
      <!-- Books will be added via JavaScript -->
    </div>

    <div class="container">
      <form action="/login" method="post" th:object="${member}">
        <h1>Welcome Back</h1>

        <div
          class="message"
          th:if="${session.success != null || session.error != null}"
        >
          <h3 style="color: green" th:text="${session.success}"></h3>
          <h3 style="color: red" th:text="${session.error}"></h3>
          <th:block th:text="${@messageManage.remove}"></th:block>
        </div>

        <div>
          <input
            type="text"
            th:field="*{email}"
            placeholder="Enter your email"
          />
        </div>

        <div>
          <input
            type="password"
            th:field="*{password}"
            placeholder="Enter your password"
          />
        </div>

        <div>
          <button type="submit">Login</button>
        </div>
      </form>
    </div>
  </body>
</html>
